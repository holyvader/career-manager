name: AWS production deployment

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Existing full image SHA to redeploy; leave empty to build this revision'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: aws-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: career_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
    env:
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET }}
      FRONTEND_IMAGE: ${{ vars.FRONTEND_IMAGE }}
      BACKEND_IMAGE: ${{ vars.BACKEND_IMAGE }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      REQUESTED_SHA: ${{ inputs.release_sha }}
      DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/career_manager
      BETTER_AUTH_SECRET: ci-only-auth-secret-for-production-build-checks
      BETTER_AUTH_URL: http://localhost:3334
      FRONTEND_URL: http://localhost:3333
    steps:
      - uses: actions/checkout@v5
      - name: Validate configuration and select release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          for key in AWS_REGION AWS_ROLE_ARN EC2_INSTANCE_ID RELEASE_BUCKET FRONTEND_IMAGE BACKEND_IMAGE APP_DOMAIN; do
            test -n "${!key}" || { echo "Missing production environment variable: $key"; exit 1; }
          done
          tag=${REQUESTED_SHA:-$GITHUB_SHA}
          [[ $tag =~ ^[0-9a-f]{40}$ ]] || { echo 'Use a full lowercase commit SHA'; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        if: inputs.release_sha == ''
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        if: inputs.release_sha == ''
        with:
          node-version: 22
      - name: Install and check application
        if: inputs.release_sha == ''
        run: |
          bun install --frozen-lockfile
          cd packages/backend
          bun run prisma:generate
          bun run prisma:migrate:deploy
          bunx --bun tsc --noEmit
          bunx biome check .
          bun test
          cd ../frontend
          bunx --bun next typegen
          bunx --bun tsc --noEmit
          bunx biome check .
          bun test
      - name: Check deployment tooling
        run: |
          bash -n deploy/aws/deploy.sh
          bash -n deploy/aws/refresh-secrets.sh
          python3 -m unittest discover -s deploy/aws -p 'test_*.py'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
        if: inputs.release_sha == ''
      - name: Check immutable images
        if: inputs.release_sha == ''
        id: images
        env:
          RELEASE_SHA: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          for app in frontend backend; do
            key="${app^^}_IMAGE"
            repository="${!key#*/}"
            if aws ecr describe-images --repository-name "$repository" --image-ids imageTag="$RELEASE_SHA" > /tmp/image.json 2>/tmp/image-error; then
              if [[ $app == frontend ]]; then
                docker pull "$FRONTEND_IMAGE:$RELEASE_SHA"
                built_domain=$(docker inspect --format '{{ index .Config.Labels "io.career-manager.app-domain" }}' "$FRONTEND_IMAGE:$RELEASE_SHA")
                [[ $built_domain == "$APP_DOMAIN" ]] || { echo 'Domain changed: build a new commit SHA'; exit 1; }
              fi
              echo "$app=false" >> "$GITHUB_OUTPUT"
            elif grep -q ImageNotFoundException /tmp/image-error; then
              echo "$app=true" >> "$GITHUB_OUTPUT"
            else
              cat /tmp/image-error >&2
              exit 1
            fi
          done
      - uses: docker/build-push-action@v6
        if: inputs.release_sha == '' && steps.images.outputs.backend == 'true'
        with:
          context: .
          file: packages/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ vars.BACKEND_IMAGE }}:${{ steps.release.outputs.tag }}
      - uses: docker/build-push-action@v6
        if: inputs.release_sha == '' && steps.images.outputs.frontend == 'true'
        with:
          context: .
          file: packages/frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ vars.FRONTEND_IMAGE }}:${{ steps.release.outputs.tag }}
          labels: |
            io.career-manager.app-domain=${{ vars.APP_DOMAIN }}
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=https://${{ vars.APP_DOMAIN }}/backend
      - name: Publish deployment bundle
        if: inputs.release_sha == ''
        env:
          RELEASE_SHA: ${{ steps.release.outputs.tag }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('deploy/aws/release.json').write_text(json.dumps({
              'sha': os.environ['RELEASE_SHA'], 'app_domain': os.environ['APP_DOMAIN'],
          }))
          PY
          tar -czf /tmp/release.tar.gz -C deploy/aws compose.yml Caddyfile deploy.sh refresh-secrets.sh render-env.py release.json
          aws s3 cp /tmp/release.tar.gz "s3://$RELEASE_BUCKET/releases/$RELEASE_SHA.tar.gz" --only-show-errors
      - name: Deploy and wait for health checks
        env:
          RELEASE_SHA: ${{ steps.release.outputs.tag }}
        run: |
          python3 deploy/aws/send-deployment.py --region "$AWS_REGION" \
            --instance "$EC2_INSTANCE_ID" --bucket "$RELEASE_BUCKET" --sha "$RELEASE_SHA"
          echo "Deployed $RELEASE_SHA to https://$APP_DOMAIN" >> "$GITHUB_STEP_SUMMARY"
