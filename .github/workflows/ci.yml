name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: career_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/career_manager
      BETTER_AUTH_SECRET: ci-test-secret-do-not-use-in-production
      BETTER_AUTH_URL: http://localhost:3334
      FRONTEND_URL: http://localhost:3333
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - name: Apply database migrations
        working-directory: packages/backend
        run: bunx --bun prisma migrate deploy
      - name: Generate Prisma client
        working-directory: packages/backend
        run: bunx --bun prisma generate
      - name: Typecheck
        working-directory: packages/backend
        run: bunx --bun tsc --noEmit
      - name: Lint
        working-directory: packages/backend
        run: bunx biome check .
      - name: Test
        working-directory: packages/backend
        run: bun test

  frontend:
    runs-on: ubuntu-latest
    env:
      # Only needed so `prisma generate` (below) doesn't fail loading
      # prisma.config.ts - nothing here actually connects to this database.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/career_manager
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - name: Generate Prisma client
        # The frontend imports the backend's Eden Treaty app type for its
        # typed RPC client, which transitively references the (gitignored)
        # generated Prisma client - needed here too, not just in the backend
        # job, or tsc fails to resolve it.
        working-directory: packages/backend
        run: bunx --bun prisma generate
      - name: Generate Next.js route types
        # LayoutProps/PageProps and friends live in .next/types, which is
        # gitignored and normally produced by `next dev`/`next build` - tsc
        # fails without it on a fresh checkout.
        working-directory: packages/frontend
        run: bunx --bun next typegen
      - name: Typecheck
        working-directory: packages/frontend
        run: bunx --bun tsc --noEmit
      - name: Lint
        working-directory: packages/frontend
        run: bunx biome check .
      - name: Test
        working-directory: packages/frontend
        run: bun test
      - name: Build
        working-directory: packages/frontend
        run: bun run build
