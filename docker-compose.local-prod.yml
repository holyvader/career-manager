# Local production runtime, independent of the development/deployment stacks.
# Run: bun run app:prod:local
# Credentials below are disposable localhost-only defaults.
name: career-manager-local-prod

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-prod-postgres
      POSTGRES_DB: career_manager
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d career_manager']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:local-prod-postgres@db:5432/career_manager
      BETTER_AUTH_SECRET: localhost-only-production-preview-secret-2026
      BETTER_AUTH_URL: https://localhost:8888
      FRONTEND_URL: https://localhost:8888
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_FROM: Career Manager <no-reply@career-manager.local>
      SMTP_TLS: 'false'
      SMTP_SSL: 'false'
      LOG_LEVEL: info
    healthcheck:
      test: ['CMD', 'bun', '-e', "const r = await fetch('http://localhost:3334/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: https://localhost:8888/backend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:3334
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3333').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20

  nginx:
    build:
      context: ./nginx/local-prod
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - '127.0.0.1:8888:443'
    volumes:
      - nginx-certs:/etc/nginx/certs
    healthcheck:
      test: ['CMD', 'wget', '--no-check-certificate', '--quiet', '--spider', 'https://127.0.0.1/']
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10

volumes:
  db-data:
  nginx-certs:
