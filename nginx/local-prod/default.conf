server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 8888;
    # Preserve streamed Next.js responses.
    proxy_buffering off;

    # Eden client requests: strip the public prefix before forwarding.
    location /backend/ {
        proxy_pass http://backend:3334/;
    }

    # Better Auth email verification and other native auth callbacks.
    location /api/auth/ {
        proxy_pass http://backend:3334;
    }

    location / {
        proxy_pass http://frontend:3333;
    }
}
